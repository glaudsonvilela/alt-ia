map $uri $alt_ia_cache_control {
    default "no-store";
    ~*\.(?:js|css|svg|png|webp|woff2|zip|txt)$ "public, max-age=300";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control $alt_ia_cache_control always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://www.youtube.com https://accounts.google.com/gsi/client; style-src 'self' https://accounts.google.com/gsi/style; connect-src 'self' https://accounts.google.com/gsi/; img-src 'self' data: https://accounts.google.com https://lh3.googleusercontent.com; font-src 'self'; frame-src https://www.youtube-nocookie.com https://accounts.google.com/gsi/; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    location ~ (^|/)\. {
        return 404;
    }

    location ~* ^/(?:src\.js|default\.conf|package(?:-lock)?\.json|.*\.md)$ {
        return 404;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /_access_check {
        internal;
        resolver 127.0.0.11 valid=10s;
        set $alt_ia_upstream alt-ia-api;
        proxy_pass http://$alt_ia_upstream:8811/api/access-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location ~ ^/api/auth/(?:config|google|verify|logout)$ {
        resolver 127.0.0.11 valid=10s;
        set $alt_ia_upstream alt-ia-api;
        proxy_pass http://$alt_ia_upstream:8811;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 20s;
        client_max_body_size 10k;
    }

    location = /login.html { try_files /login.html =404; }
    location = /login.js { try_files /login.js =404; }
    location = /login.css { try_files /login.css =404; }
    location = /geist-variable.woff2 { try_files /geist-variable.woff2 =404; }
    location = /favicon.svg { try_files /favicon.svg =404; }

    location = /api/chat {
        resolver 127.0.0.11 valid=10s;
        set $alt_ia_upstream alt-ia-api;
        proxy_pass http://$alt_ia_upstream:8811/api/chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Content-Type $content_type;
        proxy_read_timeout 95s;
        client_max_body_size 30k;
    }

    location ~ ^/api/history(?:/delete)?$ {
        resolver 127.0.0.11 valid=10s;
        set $alt_ia_upstream alt-ia-api;
        proxy_pass http://$alt_ia_upstream:8811$request_uri;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Content-Type $content_type;
        proxy_read_timeout 20s;
        client_max_body_size 2m;
    }

    location = /api/me {
        resolver 127.0.0.11 valid=10s;
        set $alt_ia_upstream alt-ia-api;
        proxy_pass http://$alt_ia_upstream:8811/api/me;
        proxy_set_header Cookie $http_cookie;
    }

    location /api/agent/ {
        resolver 127.0.0.11 valid=10s;
        set $alt_ia_upstream alt-ia-api;
        proxy_pass http://$alt_ia_upstream:8811;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Content-Type $content_type;
        proxy_read_timeout 165s;
        client_max_body_size 4k;
    }

    location = /api/pool-options {
        resolver 127.0.0.11 valid=10s;
        set $alt_ia_upstream alt-ia-api;
        proxy_pass http://$alt_ia_upstream:8811/api/pool-options;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location = /api/pool-snapshot {
        resolver 127.0.0.11 valid=10s;
        set $alt_ia_upstream alt-ia-api;
        proxy_pass http://$alt_ia_upstream:8811/api/pool-snapshot$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location = /api/pool-chart {
        resolver 127.0.0.11 valid=10s;
        set $alt_ia_upstream alt-ia-api;
        proxy_pass http://$alt_ia_upstream:8811/api/pool-chart$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location ~ ^/api/lending-(markets|market|wallet)$ {
        resolver 127.0.0.11 valid=10s;
        set $alt_ia_upstream alt-ia-api;
        proxy_pass http://$alt_ia_upstream:8811$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri =404;
    }
}
