server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control "public, max-age=300" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api/chat {
        resolver 127.0.0.11 valid=10s;
        set $alt_ia_upstream alt-ia-api;
        proxy_pass http://$alt_ia_upstream:8811/api/chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Content-Type $content_type;
        proxy_read_timeout 95s;
        client_max_body_size 30k;
    }

    location /api/agent/ {
        resolver 127.0.0.11 valid=10s;
        set $alt_ia_upstream alt-ia-api;
        proxy_pass http://$alt_ia_upstream:8811;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Content-Type $content_type;
        proxy_read_timeout 165s;
        client_max_body_size 4k;
    }

    location = /api/pool-options {
        resolver 127.0.0.11 valid=10s;
        set $alt_ia_upstream alt-ia-api;
        proxy_pass http://$alt_ia_upstream:8811/api/pool-options;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location = /api/pool-snapshot {
        resolver 127.0.0.11 valid=10s;
        set $alt_ia_upstream alt-ia-api;
        proxy_pass http://$alt_ia_upstream:8811/api/pool-snapshot$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location = /api/pool-chart {
        resolver 127.0.0.11 valid=10s;
        set $alt_ia_upstream alt-ia-api;
        proxy_pass http://$alt_ia_upstream:8811/api/pool-chart$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri =404;
    }
}
